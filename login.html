<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Janova Technologies | Client Login
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-page">


    <div class="login-background">

        <div class="login-orb orb-one"></div>

        <div class="login-orb orb-two"></div>

        <div class="login-grid"></div>

    </div>


    <a
        href="index.html"
        class="back-home"
    >
        ← Back to Website
    </a>


    <div class="login-wrapper">


        <div class="login-visual">


            <div class="login-robot">

                <div class="robot-head">

                    <div class="robot-eye"></div>

                    <div class="robot-eye"></div>

                </div>


                <div class="robot-body">

                    <div class="robot-core"></div>

                </div>


                <div class="robot-arm robot-left"></div>

                <div class="robot-arm robot-right"></div>

            </div>


            <div class="login-hologram">

                JANOVA AI

            </div>


        </div>


        <div class="login-box">


            <div class="login-logo">

                J

            </div>


            <span class="login-label">

                CLIENT PORTAL

            </span>


            <h1>

                Welcome
                <b>Back.</b>

            </h1>


            <p>

                Login to access your Janova
                project dashboard.

            </p>


            <form id="loginForm">


                <label>

                    Email Address

                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="client@email.com"
                    required
                >


                <label>

                    Password

                </label>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn login-submit"
                >

                    Login to Dashboard →

                </button>


            </form>


            <div class="login-divider">

                <span>
                    NEW CLIENT?
                </span>

            </div>


            <a
                href="index.html#contact"
                class="login-enquiry"
            >

                Submit a Project Enquiry

            </a>


            <small class="login-note">

                Client dashboard access will be enabled
                after your project account is created.

            </small>


        </div>

    </div>


    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
